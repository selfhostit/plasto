name: Security

# Looks for security problems on every pull request and push to main, and every Monday,
# so a newly published vulnerability in a dependency or the base image is found even
# when nothing changed here. CodeQL findings are listed under Security > Code scanning.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  # Static analysis of the Go backend, the web app, the Python workers and the workflows.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.language == 'go'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build the backend
        if: matrix.language == 'go'
        working-directory: backend
        run: go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # Known vulnerabilities (with a fix available) in the Go, npm and Python dependencies,
  # and, after a push or on Monday, in the released images.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan the dependencies
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Find the released images
        id: released
        if: github.event_name != 'pull_request'
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if docker manifest inspect "$image:latest" >/dev/null 2>&1; then
            echo "app=$image:latest" >> "$GITHUB_OUTPUT"
            echo "worker=$image-worker:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan the released app image
        if: steps.released.outputs.app
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.released.outputs.app }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Scan the released worker image
        if: steps.released.outputs.worker
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.released.outputs.worker }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  # New dependencies in a pull request with known vulnerabilities.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Passwords, keys and tokens committed anywhere in the history.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      # from gitleaks_8.28.0_checksums.txt; update both together
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # the CLI directly: gitleaks-action needs a paid license for organization repositories
      - name: Scan the history for secrets
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
