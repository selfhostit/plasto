name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format, vet and test
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint, check, test and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run check
          npm test
          npm run build

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: workers/uv.lock
      # the tests build the backend and run the worker kit and the workers against it
      - name: Lint and test
        working-directory: workers
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

  # TEMPLATE start (rename.sh removes this job from new apps)
  # Makes an app from the template the way a person would, then checks and tests it.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Rename, strip the demo, check and test
        run: |
          git remote set-url origin https://github.com/example/door-bell.git
          scripts/rename.sh
          scripts/strip-demo.sh
          if git grep -n -i plasto | grep -v -e plasto_worker -e 'built on'; then
            echo "rename.sh missed the lines above"
            exit 1
          fi
          make setup check test
          cd web && npm run build
  # TEMPLATE end

  image:
    needs: [backend, web, workers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # to sign the provenance attestations of the published images
      id-token: write
      attestations: write
    env:
      # a release tag (v1.2.3) names the version; otherwise the commit does
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build both images for this runner and deploy them with the compose file.
      - name: Build the app for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: plasto:smoke
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build the worker for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: workers
          load: true
          tags: plasto-worker:smoke
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Smoke test
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tailscale.yml config -q
          deploy/smoke-test.sh
        env:
          PLASTO_IMAGE: plasto:smoke
          PLASTO_WORKER_IMAGE: plasto-worker:smoke
          EXPECT_VERSION: ${{ env.VERSION }}

      # On main and on release tags, publish both images for every platform people run them on.
      # A release (v1.2.3) moves :latest, which installs follow; main only moves :edge.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: github.event_name == 'push'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        if: github.event_name == 'push'
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "image=$image" >> "$GITHUB_ENV"
          for name in app worker; do
            [ $name = app ] && base=$image || base=$image-worker
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              v=${GITHUB_REF_NAME#v}
              tags="$base:$GITHUB_REF_NAME,$base:$v"
              case $v in
              *-*) ;; # a pre-release (1.2.0-rc.1) moves nothing else
              *) tags="$tags,$base:${v%.*},$base:${v%%.*},$base:latest" ;;
              esac
            else
              tags="$base:edge,$base:$GITHUB_SHA"
            fi
            echo "${name}_tags=$tags" >> "$GITHUB_ENV"
          done
      - name: Publish the app
        id: app
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # a software bill of materials (SPDX), attached to the image on ghcr.io
          sbom: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.app_tags }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Publish the worker
        id: worker
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: workers
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # a software bill of materials (SPDX), attached to the image on ghcr.io
          sbom: true
          tags: ${{ env.worker_tags }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # Signed statements of which workflow and commit built each image; check one with
      # `gh attestation verify oci://<image>:<tag> --repo <owner>/<repo>` (docs/deploy.md).
      - name: Attest the app
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
      - name: Attest the worker
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.image }}-worker
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true
